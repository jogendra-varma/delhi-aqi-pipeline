name: Daily Delhi AQI Ingestion Pipeline

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4.2.2

    - name: Set Up Python Runtime Engine
      uses: actions/setup-python@v5.3.0
      with:
        python-version: '3.10'

    - name: Install Ingestion Libraries
      run: |
        pip install pandas numpy sqlalchemy psycopg2-binary requests

    - name: Run Processing Engine
      env:
        NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      run: |
        python main.py
